[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"reasoner/impact.py" = ["S603", "S607"]
"tests/*" = ["S101", "S105", "S106", "S107", "S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
